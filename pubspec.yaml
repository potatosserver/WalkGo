
name: walkgo
description: "A new Flutter project."
publish_to: 'none'
version: V1.1.0+3

environment:
  sdk: '>=3.5.0-188.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_background_service: ^5.1.0 # Updated version
  flutter_local_notifications: ^20.1.0
  health: ^13.2.1
  provider: ^6.0.2
  shared_preferences: ^2.0.15
  permission_handler: ^12.0.1
  intl: ^0.20.2
  device_info_plus: ^12.3.0
  go_router: ^17.0.1
  fluttertoast: ^9.0.0
  group_radio_button: ^1.3.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^9.0.0
  dio: ^5.9.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  crypto: ^3.0.7
  http: ^1.6.0
  pub_semver: ^2.2.0
  flutter_svg: ^2.2.3
  flutter_markdown_plus: ^1.0.7
  flutter_background_service_android: ^6.3.1
  # The following line was the problem and has been removed:
  # flutter_background_service_android: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/adi-registration.properties
