name: Build Flutter APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 關鍵修正：在安裝前強制清空 pub 雲端快取，避免抓到過期的相容層殘留
      - name: Clear Pub Cache & Fresh Install
        run: |
          flutter pub cache clean --force
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkGo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
