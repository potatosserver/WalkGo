name: Build Flutter APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "Validating secrets..."
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          if ! echo "$KEYSTORE_BASE64" | base64 --decode > /dev/null; then
            echo "::error::KEYSTORE_BASE64 secret is not a valid Base64 string. Please re-generate and set it correctly."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is not set."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::STORE_PASSWORD secret is not set."
            exit 1
          fi
          echo "Secrets validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clear Pub Cache & Fresh Install
        run: |
          flutter pub cache clean --force
          flutter pub get

      - name: Decode Keystore and Create Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "Decoding keystore..."
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/upload-keystore.jks
          echo "Creating key.properties file..."
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
          echo "storePassword=${STORE_PASSWORD}" >> android/key.properties
          echo "Keystore and properties files created successfully."

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkGo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
