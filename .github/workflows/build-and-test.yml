name: Build and Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "Validating secrets..."
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set."; exit 1; fi
          if ! echo "$KEYSTORE_BASE64" | base64 --decode > /dev/null; then echo "::error::KEYSTORE_BASE64 is not a valid Base64 string."; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "::error::KEY_ALIAS secret is not set."; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "::error::KEY_PASSWORD secret is not set."; exit 1; fi
          if [ -z "$STORE_PASSWORD" ]; then echo "::error::STORE_PASSWORD secret is not set."; exit 1; fi
          echo "Secrets validation passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate L10n
        run: flutter gen-l10n

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
          echo "storePassword=${STORE_PASSWORD}" >> android/key.properties

      - name: Verify Flutter Version
        run: flutter --version

      - name: Build APK
        run: flutter build apk --split-per-abi --obfuscate --split-debug-info=./build/app/outputs/debug-info-apk --strip-debug-symbols

      - name: Upload Test APKs
        uses: actions/upload-artifact@v7
        with:
          name: Test-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
